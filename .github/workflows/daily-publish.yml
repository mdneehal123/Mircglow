name: Daily publish
# Rebuilds the site every morning (India time). Pages in content/plan/schedule.json go live on their date,
# then search engines are told about the new addresses through IndexNow.
on:
  schedule:
    - cron: "35 0 * * *"   # 06:05 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python3 build.py
          python3 check.py | tail -1
      - name: Commit if anything new went live
        id: commit
        run: |
          git add -A dist
          if git diff --cached --quiet; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          NEW=$(git diff --cached --name-only --diff-filter=A dist | grep '/index.html$' | sed 's#^dist##; s#index.html$##' | tr '\n' ' ')
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          git config user.name "Mirc Glow publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish scheduled pages: ${NEW:-updates}"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Tell search engines (IndexNow)
        if: steps.commit.outputs.changed == 'yes'
        run: |
          sleep 120   # give Vercel time to deploy
          URLS=$(for p in ${{ steps.commit.outputs.new }} / /blog/; do printf '"https://mircglow.com%s",' "$p"; done)
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json' \
            -d "{\"host\":\"mircglow.com\",\"key\":\"74d314fcd13a092ae512fe4c12566f9f\",\"keyLocation\":\"https://mircglow.com/74d314fcd13a092ae512fe4c12566f9f.txt\",\"urlList\":[${URLS%,}]}" -w '\nHTTP %{http_code}\n'
