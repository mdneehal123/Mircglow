name: Check domain
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DNS and what each address serves
        run: |
          {
          for d in mircglow.com www.mircglow.com; do
            echo "== $d"; echo "A: $(dig +short A $d @1.1.1.1 | tr '\n' ' ')"; echo "AAAA: $(dig +short AAAA $d @1.1.1.1 | tr '\n' ' ')"; echo "CNAME: $(dig +short CNAME $d @1.1.1.1 | tr '\n' ' ')"
            echo "A via Google DNS: $(dig +short A $d @8.8.8.8 | tr '\n' ' ')"
            for s in http https; do
              echo "-- $s://$d/"; curl -sS -m 25 -o /tmp/b -D - "$s://$d/" 2>&1 | grep -iE "^(HTTP|server|location|x-vercel|x-powered-by|link: <https://mircglow.com/wp-json)" | head -8
              echo "title: $(grep -o '<title>[^<]*' /tmp/b | head -1)"; echo "new design: $(grep -c 'class=\"lux' /tmp/b)"
            done
          done
          echo "== NS: $(dig +short NS mircglow.com | tr '\n' ' ')"
          } > domain.txt 2>&1
          cat domain.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain.txt && git commit -m "Domain check" && git push
