name: Check domain
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 90
          {
          for p in avocado-cream-in-kg avocado-cream-in-kg-hindi; do
            echo "$p $(curl -s -o /dev/null -w '%{http_code}' https://mircglow.com/$p/)"
          done
          echo "sitemap urls: $(curl -s https://mircglow.com/sitemap.xml | grep -c '<loc>')"
          } > domain.txt 2>&1; cat domain.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain.txt && git commit -m "Domain check" && git pull --rebase -q && git push
