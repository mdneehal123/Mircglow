name: Check domain
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 90
          { curl -s https://mircglow.com/product/glass-glow-cream/ -o /tmp/h; echo "fbt: $(grep -c 'h-fbt' /tmp/h) compare: $(grep -c 'h-cmp' /tmp/h)"; } > domain.txt; cat domain.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain.txt && git commit -m "Domain check" && git pull --rebase -q && git push
