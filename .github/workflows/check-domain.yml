name: Check domain
on:
  push:
    branches: [site-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sleep 90
          { curl -s https://mircglow.com/ -o /tmp/h; echo "home $(curl -s -o /dev/null -w '%{http_code}' https://mircglow.com/)"; echo "new layout: $(grep -c 'fk-hero' /tmp/h)"; echo "h1: $(grep -c '<h1' /tmp/h)"; } > domain.txt; cat domain.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain.txt && git commit -m "Domain check" && git pull --rebase -q && git push
